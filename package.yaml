name:                websockets
version:             0.13.0.0
synopsis:            A sensible and clean way to write WebSocket-capable servers in Haskell.
description:         |
  This library allows you to write WebSocket-capable servers.

  An example server: <https://github.com/jaspervdj/websockets/blob/master/example/server.lhs>

  An example client: <https://github.com/jaspervdj/websockets/blob/master/example/client.hs>

  See also:
  * The specification of the WebSocket protocol: <http://www.whatwg.org/specs/web-socket-protocol/>
  * The JavaScript API for dealing with WebSockets: <http://www.w3.org/TR/websockets/>
license:             BSD3
license-file:        LICENCE
copyright:
- (c) 2010-2011 Siniša Biđin
- (c) 2011-2018 Jasper Van der Jeugt
- (c) 2011 Steffen Schuldenzucker
- (c) 2011 Alex Lang
author:
- Siniša Biđin <sinisa@bidin.cc>
- Jasper Van der Jeugt <m@jaspervdj.be>
- Steffen Schuldenzucker <steffen.schuldenzucker@googlemail.com>
- Alex Lang <lang@tsurucapital.com>
maintainer:          Jasper Van der Jeugt <m@jaspervdj.be>
category:            Network
homepage:            http://jaspervdj.be/websockets
bug-reports:         https://github.com/jaspervdj/websockets/issues

extra-source-files:
- CHANGELOG

default-extensions:
- LambdaCase
- OverloadedStrings

dependencies:
- SHA               >= 1.5    && < 1.7
- async             >= 2.2    && < 2.3
- attoparsec        >= 0.10   && < 0.15
- base              >= 4.8    && < 5
- base64-bytestring >= 0.1    && < 1.3
- binary            >= 0.8.1  && < 0.11
- bytestring        >= 0.9    && < 0.12
- bytestring-builder             < 0.11
- case-insensitive  >= 0.3    && < 1.3
- clock             >= 0.8    && < 0.9
- containers        >= 0.3    && < 0.7
- entropy           >= 0.2.1  && < 0.5
- http-types
- network           >= 2.3    && < 3.2
- random            >= 1.0    && < 1.3
- streaming-commons >= 0.1    && < 0.3
- text              >= 0.10   && < 2.1
- wai

flags:
  example:
    description: Build the example server
    default: false
    manual: true

  website:
    description: Build the website
    default: false
    manual: true

ghc-options:
- -Wall

library:
  source-dirs: src
  c-sources: cbits/cbits.c
  exposed-modules:
  - Network.WebSockets
  - Network.WebSockets.Client
  - Network.WebSockets.Connection
  - Network.WebSockets.Extensions
  - Network.WebSockets.Stream
  - Network.Wai.Handler.WebSockets
  # - Network.WebSockets.Util.PubSub TODO

executables:
  websockets-example:
    when:
    - condition: "!flag(example)"
      buildable: false
    main: server.lhs
    source-dirs:
    - example
    dependencies:
    - websockets

  websockets-autobahn:
    when:
    - condition: "!flag(example)"
      buildable: false
    main: server.hs
    source-dirs:
    - tests/autobahn
    ghc-options:
    - -threaded
    - -O2
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - websockets

  websockets-website:
    when:
    - condition: "!flag(website)"
      buildable: false
    main: site.hs
    source-dirs:
    - web
    dependencies:
    - filepath
    - hakyll

benchmarks:
  bench-mask:
    main: mask.hs
    source-dirs:
    - benchmarks
    - src
    c-sources: cbits/cbits.c
    dependencies:
    - criterion

tests:
  websockets-tests:
    main: TestSuite.hs
    source-dirs:
    - src
    - tests/haskell
    c-sources: cbits/cbits.c
    dependencies:
    - HUnit                      >= 1.2 && < 1.7
    - QuickCheck                 >= 2.7 && < 2.15
    - test-framework             >= 0.4 && < 0.9
    - test-framework-hunit       >= 0.2 && < 0.4
    - test-framework-quickcheck2 >= 0.2 && < 0.4
